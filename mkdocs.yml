site_name: wwdates
site_description: Global calendar system. Python package.
repo_url: https://github.com/guilhermegor/wwdates
nav:
  - Home: index.md
  - Usage: usage.md
  - Examples: examples.md
  - API Reference: api.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md
theme:
  name: material
  # Native Material mechanism: places the image in the top bar left of the site name, with no
  # custom CSS, template override or build hook. Same asset as the README/index.md inline logo.
  logo: assets/logo_wwdates_no_description.png
  favicon: assets/logo_wwdates_no_description.png
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Include files from the repo root (e.g. CHANGELOG.md) into a docs page, single-sourced.
  - pymdownx.snippets:
      base_path:
        - .

extra_css:
  - stylesheets/extra.css

# Non-published docs: MkDocs builds every .md under docs/, so working
# documents must be excluded here or they ship to readers.
exclude_docs: |
  # NOTE: .gitignore syntax — comments must be on their own line. A trailing
  # "# ..." after a pattern becomes part of the pattern and silently disables it.
  # work-to-do backlogs / follow-up notes
  backlog/
  # design specs / working notes, not published
  superpowers/
  # docs/ authoring guidance, not a published page
  CLAUDE.md
  # offline merge-checkpoint log, internal
  checkpoints.md
  # git-ignored scaffolding-lessons record, never published
  blueprintx-lessons.md
  # git-ignored toolchain-lessons record, never published
  dotfiles-dev-lessons.md
