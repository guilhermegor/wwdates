# Weekly, NON-BLOCKING offline<->web calendar drift detector — issue #12.
#
# Compares every offline calendar against the live page its publisher maintains and, on any
# divergence, opens or updates ONE tracking issue. It is deliberately kept OUT of the PR gate and
# the release path:
#   * `tests/conftest.py` blocks the network on purpose, so this can never run at test time; and
#   * a B3/ANBIMA outage and a real drift are indistinguishable in a red check, so a red check must
#     never gate a PR.
# Failure here is an OPENED ISSUE, never a failed required check. `check_calendar_drift.py` always
# exits 0 on detected drift; only an unhandled crash reddens the run, and a scheduled run reddening
# blocks nothing.
#
# Why a SCHEDULED job at all (this repo's CI is otherwise event-driven): the library is
# offline-first, and parity between each offline class and its `*Web` twin was verified ONCE, BY
# HAND, in PR #10. Nothing at PR time can see B3 adding a closure AFTER we shipped. This is the job
# that goes back and looks again. The `schedule` trigger GitHub auto-disables after ~60 days
# without a push — acceptable while the repo is active; `workflow_dispatch` re-runs it meanwhile.

name: Calendar Drift

on:
  schedule:
    - cron: "37 6 * * 1" # 06:37 UTC every Monday (UTC always; odd minute to dodge load spikes)
  workflow_dispatch: {}

permissions:
  contents: read # read the package source
  issues: write # open / update the single tracking issue

concurrency:
  group: calendar-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Detect calendar drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      # The `web` extra pulls Playwright, which DatesUSFederalHolidaysWeb drives; without it that
      # provider raises ImportError and a quarter of the sweep would report "could not check".
      - name: Install the package with the web extra
        run: poetry install --no-interaction --extras web

      - name: Install the Chromium browser
        run: poetry run playwright install --with-deps chromium

      - name: Run the drift sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: poetry run python bin/check_calendar_drift.py
