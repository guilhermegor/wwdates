name: Run Tests

on:
  workflow_call:
    outputs:
      ready_for_release:
        description: "Whether all tests passed successfully"
        value: ${{ jobs.test.result == 'success' }}
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  test:
    name: Run Automated Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Must track pyproject's `python = ">=3.10,<4.0"`. 3.9 was listed here but is below the
        # floor, so that leg never actually exercised the package; 3.14 is released and supported.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history so the work-ledger gate can resolve merge-base(HEAD, origin/main). A
          # shallow clone has no common ancestor to diff the branch against, so `_base_ref()`
          # returns None, the diff comes back empty, and the gate PASSES having examined nothing —
          # the silent-no-op failure mode, not a red check. See bin/check_backlog_ledger.py.
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      # Fail loud on a stale lock instead of silently regenerating it. A poetry.lock that no
      # longer matches pyproject.toml means dependencies changed without re-locking; regenerating
      # here (rm + poetry lock) would re-resolve and upgrade every dependency to the latest
      # in-range version — a non-reproducible build that can silently pull a breaking release.
      # Require an intentional `poetry lock` + commit instead. (A version bump does NOT invalidate
      # the lock — only a dependency change does.)
      #
      # This is its OWN step, deliberately. It used to live inside the cache-guarded install step
      # below, which meant that on a cache hit the guard never ran at all — the gate was disabled
      # by exactly the condition that makes it cheap to run.
      - name: Verify poetry.lock Is In Sync With pyproject.toml
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml — run 'poetry lock' locally and commit the result." >&2
            exit 1
          fi

      # The key MUST hash poetry.lock as well as pyproject.toml. Hashing pyproject.toml alone made
      # every lock-only change a cache hit — so the job restored a stale .venv, skipped the install
      # entirely, and reported green while testing the OLD dependency set. That silently defeats
      # Dependabot, whose `versioning-strategy: lockfile-only` produces precisely lock-only diffs
      # (.github/dependabot.yml).
      #
      # poetry.lock is NOT in `path:` either: caching a tracked file means a restored cache
      # overwrites the repo's committed lockfile, so the check above would validate a cache
      # artifact instead of what is actually in the tree. Cache build outputs, never source.
      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      # No pyproject.toml rewriting here. The template ships a `python -c` transform that strips
      # `pywin32` / `platform = "win32"` dependencies before installing on non-Windows — correct for
      # filings-cvm, which HAS pywin32, and dead code here: wwdates declares no Windows-only
      # dependency (the `win32` strings in poetry.lock are transitive wheel FILENAMES, not
      # declarations). It copied, rewrote and restored pyproject.toml to no effect, and a failure
      # partway through would have left the rewritten file behind.
      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          poetry install --no-interaction --no-root
          poetry env activate

      - name: Run Spell Check (codespell)
        if: runner.os == 'Linux'
        run: |
          poetry run codespell .
          if [ $? -ne 0 ]; then
            echo "Typos found! Run 'codespell .' locally to see them."
            exit 1
          fi

      - name: Run Docstring Type Consistency Check
        if: runner.os == 'Linux'
        run: |
          poetry run python -m pydocstyle --select=D412,D417 --match="(src|tests).*\\.py" src/ tests/
          poetry run python bin/check_docstrings.py

      - name: Run Work-Ledger Enforcement
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        # Mirrors the `check-backlog-ledger` pre-commit hook: a branch touching any src/ci path
        # must add or edit a docs/backlog work ledger, and every ledger must match the template.
        # Explicit CI step for gate parity — a hook-only gate is bypassed by `--no-verify`.
        env:
          # Diff-based, so the PR's base SHA is the comparison point. Passed via env, never inline
          # in `run:`, and reachable thanks to the fetch-depth:0 checkout above.
          LEDGER_BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The PR's AUTHOR, which never changes — unlike GITHUB_ACTOR, which becomes whoever
          # re-ran or updated the branch and so would silently cancel the bot exemption.
          LEDGER_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: poetry run python bin/check_backlog_ledger.py

      - name: Run Ruff Linting
        if: runner.os == 'Linux'
        run: |
          poetry run ruff check src/ tests/ --config=ruff.toml
          if [ $? -ne 0 ]; then
            echo "Ruff found issues! Run 'ruff check src/ tests/' locally see details."
            echo "To fix automatically, run: poetry run ruff check --fix src/ tests/"
            exit 1
          fi

      - name: Run Static Type Check (mypy)
        if: runner.os == 'Linux'
        # Run from src/ so it is the single package base (avoids the dual-root
        # "found twice" error on the deeper DDD tree).
        run: cd src && poetry run mypy --config-file ../mypy.ini .

      - name: Run Non-Python Lint Gates (shell, sql, yaml)
        if: runner.os == 'Linux'
        # Mirrors `make lint` and the pre-commit lint-* hooks (one home, zero drift).
        # shellcheck/shfmt are system tools; install them so the shell gate actually runs
        # in CI (the wrappers skip gracefully on a box without them).
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          poetry run pip install shfmt-py >/dev/null 2>&1 || true
          bash bin/lint_shell.sh --check
          bash bin/lint_sql.sh
          bash bin/lint_yaml.sh

      - name: Run Integration Tests
        # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
        # fresh project with an empty integration suite does not fail CI; real
        # failures (exit 1) still fail the step.
        run: poetry run pytest tests/integration/ -v || [ $? -eq 5 ]

      - name: Run Unit Tests
        run: poetry run pytest tests/unit/ || [ $? -eq 5 ]

      - name: Run Coverage Report
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          poetry run pytest --cov=src --cov-report=xml --no-header -q tests/unit/
          poetry run genbadge coverage -i coverage.xml -o coverage.svg

      - name: Upload Badge
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.svg
